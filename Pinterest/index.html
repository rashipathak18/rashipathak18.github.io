<!-- Bootstrap Toast notification -->
<div class="toast-box">
    <div id="saveToast" class="toast align-items-center text-white border-0" role="alert" style="background:#e60023;">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg">Pin saved!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>

<!-- Bootstrap Modal - Pin Preview -->
<div class="modal fade" id="pinModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:20px; overflow:hidden;">
            <div class="modal-body p-0">
                <img id="modalImg" src="" alt="pin" style="width:100%; border-radius:20px;">
            </div>
            <div class="modal-footer border-0 justify-content-between">
                <span class="text-muted" style="font-size:13px;">Pinterest Clone</span>
                <button class="btn btn-danger rounded-pill px-4" onclick="saveFromModal()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Load saved pins from localStorage
    let savedPins = JSON.parse(localStorage.getItem('savedPins')) || [];

    // Mark already-saved pins on page load
    window.onload = function () {
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const imgSrc = card.querySelector('img').src;
            const btn = card.querySelector('.save-btn');
            if (savedPins.includes(imgSrc)) {
                btn.textContent = 'Saved';
                btn.classList.add('saved');
            }
        });

        // Open modal on image click
        cards.forEach(card => {
            card.querySelector('img').addEventListener('click', function () {
                document.getElementById('modalImg').src = this.src;
                const modal = new bootstrap.Modal(document.getElementById('pinModal'));
                modal.show();
            });
        });
    };

    // Save pin function
    function savePin(btn) {
        const imgSrc = btn.closest('.card').querySelector('img').src;

        if (!savedPins.includes(imgSrc)) {
            savedPins.push(imgSrc);
            localStorage.setItem('savedPins', JSON.stringify(savedPins));
            btn.textContent = 'Saved';
            btn.classList.add('saved');
            showToast('Pin saved! ❤️');
        } else {
            savedPins = savedPins.filter(p => p !== imgSrc);
            localStorage.setItem('savedPins', JSON.stringify(savedPins));
            btn.textContent = 'Save';
            btn.classList.remove('saved');
            showToast('Pin removed');
        }
    }

    // Save from modal
    function saveFromModal() {
        const imgSrc = document.getElementById('modalImg').src;
        if (!savedPins.includes(imgSrc)) {
            savedPins.push(imgSrc);
            localStorage.setItem('savedPins', JSON.stringify(savedPins));
            showToast('Pin saved! ❤️');
        } else {
            showToast('Already saved!');
        }
    }

    // Bootstrap toast
    function showToast(msg) {
        document.getElementById('toastMsg').textContent = msg;
        const toastEl = document.getElementById('saveToast');
        const toast = new bootstrap.Toast(toastEl, { delay: 2000 });
        toast.show();
    }

    // Search filter (DOM manipulation)
    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const tags = card.getAttribute('data-tags') || '';
            card.style.display = tags.includes(query) || query === '' ? 'block' : 'none';
        });
    }

    // Tag badge filter
    function filterByTag(tag) {
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const tags = card.getAttribute('data-tags') || '';
            card.style.display = tag === 'all' || tags.includes(tag) ? 'block' : 'none';
        });
    }
</script>
